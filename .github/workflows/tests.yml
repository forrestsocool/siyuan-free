name: Tests

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kernel/go.mod
          cache-dependency-path: kernel/go.sum

      - name: Test local unlock extras
        run: go test -tags 'fts5 sqlcipher' ./model ./api -run 'Test(EnsureLocalUnlockUser|RefreshUserUsesLocalUnlockUser|GetCloudUserUsesLocalUnlockUser|CloudUser|ResolveCloudUserRefresh|LocalInbox|APIContractLocal|APIContractInbox|APIContractSettingCloudUserCached|APIContractRouterCoverage)' -count=1

      - name: Check generated API contracts
        run: go run ./apicontract/cmd/apigen --check

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            extra/requirements.txt
            extra/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run sidecar tests
        run: pytest -q

      - name: Test Docker startup compatibility
        working-directory: .
        run: python -m unittest discover -s scripts -p test_docker_entrypoint.py -v

      - name: Test Docker release and runtime cache
        working-directory: .
        run: python -m unittest discover -s scripts -p test_docker_release.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install repository pnpm version
        working-directory: app
        run: npm install --global $(node -p 'require("./package.json").packageManager')
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: app
        run: pnpm run typecheck
      - name: Test sync settings
        working-directory: app
        run: node --import tsx --test src/config/tabs/syncTab.test.ts src/config/tabs/cloudUser.test.ts
